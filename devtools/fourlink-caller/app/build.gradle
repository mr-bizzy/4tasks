plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'uk.mr_biz.fourlink.caller'
    compileSdk 36
    defaultConfig {
        applicationId 'uk.mr_biz.fourlink.caller'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin { jvmToolchain(17) }
    // A second copy signed with a key that is NOT in the family list, to prove a stranger is refused.
    // Pass -PstrangerKeystore=/path.jks (store and key password "strangerpw", alias "stranger"),
    // then build assembleStranger. Its package is uk.mr_biz.fourlink.caller.stranger.
    if (project.hasProperty('strangerKeystore')) {
        signingConfigs {
            stranger {
                storeFile file(project.property('strangerKeystore'))
                storePassword 'strangerpw'
                keyAlias 'stranger'
                keyPassword 'strangerpw'
            }
        }
        buildTypes {
            stranger {
                initWith buildTypes.debug
                applicationIdSuffix '.stranger'
                signingConfig signingConfigs.stranger
                matchingFallbacks = ['debug']
            }
        }
    }
}
dependencies {
    implementation project(':fourlink')
}
