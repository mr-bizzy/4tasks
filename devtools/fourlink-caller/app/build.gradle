plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'uk.mr_biz.fourlink.caller'
    compileSdk 36
    defaultConfig {
        applicationId 'uk.mr_biz.fourlink.caller'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin { jvmToolchain(17) }
    // A second copy signed with a key that is NOT in the family list, to prove a stranger is refused.
    // Pass -PstrangerKeystore=/path.jks (store and key password "strangerpw", alias "stranger"),
    // then build assembleStranger. Its package is uk.mr_biz.fourlink.caller.stranger.
    if (project.hasProperty('strangerKeystore')) {
        signingConfigs {
            stranger {
                storeFile file(project.property('strangerKeystore'))
                storePassword 'strangerpw'
                keyAlias 'stranger'
                keyPassword 'strangerpw'
            }
        }
        buildTypes {
            stranger {
                initWith buildTypes.debug
                applicationIdSuffix '.stranger'
                signingConfig signingConfigs.stranger
                matchingFallbacks = ['debug']
            }
        }
    }
}
// A copy signed with the FAMILY RELEASE key, to prove a release build of 4Tasks treats it as family.
// Set FOURTASKS_SIGNING_PROPERTIES (storeFile, storePassword, keyAlias, keyPassword) and build assembleFamilyRelease.
def familyProps = new Properties()
def familyPath = System.getenv('FOURTASKS_SIGNING_PROPERTIES')
if (familyPath && new File(familyPath).isFile()) new File(familyPath).withInputStream { familyProps.load(it) }
if (familyProps.getProperty('storeFile')) {
    android {
        signingConfigs {
            family {
                storeFile file(familyProps.getProperty('storeFile').trim())
                storePassword familyProps.getProperty('storePassword').trim()
                keyAlias familyProps.getProperty('keyAlias').trim()
                keyPassword familyProps.getProperty('keyPassword').trim()
                storeType 'PKCS12'
            }
        }
        buildTypes {
            familyRelease {
                initWith buildTypes.debug
                applicationIdSuffix '.family'
                signingConfig signingConfigs.family
                matchingFallbacks = ['debug']
            }
        }
    }
}
dependencies {
    implementation project(':fourlink')
}
